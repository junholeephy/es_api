# 설정 예시. 이 파일을 configs/env.yaml 로 복사해서 실값을 채운다.
#
# 실값이 든 env.yaml 은 저장소에 올라가지 않는다.
# .gitignore 가 configs/*.yaml 을 통째로 막고 이 파일만 예외로 둔다.

paths:
  # 이 파이썬으로 갈아타서 실행한다. activate 불필요.
  # 비워두면 지금 켜져 있는 파이썬으로 그냥 돈다.
  venv:

elasticsearch:
  # 접속 정보와 API Key. 실값은 이 파일이 아니라 env.yaml 에만 적는다.
  hosts:
    - "https://elasticsearch.internal:9200"
  api_key: ""
  # 일시적 오류(429/502/503/504, 타임아웃)는 클라이언트가 흡수한다.
  # 애플리케이션 쪽에 재시도를 겹치지 않는다 — 대기 시간이 곱으로 늘어난다.
  request_timeout: 60
  max_retries: 3
  # 자체 서명 인증서를 쓰는 클러스터라면 CA 번들 경로를 적는다.
  ca_certs:
  # 인증서 검증. false 로 두면 통신은 암호화되지만 상대가 누구인지는 확인하지
  # 않는다 — 중간에 낀 서버를 가려낼 수 없다. CA 번들을 구할 수 있으면
  # 위의 ca_certs 를 쓰는 편이 낫다. 둘을 같이 적으면 시작하지 않는다.
  verify_certs: false

query:
  # 조회 대상. 와일드카드를 쓸 수 있다.
  index: "logs-*"
  # 시간 범위 필터를 걸 필드.
  time_field: "@timestamp"
  # scroll 한 번에 받아올 문서 수. 하루 100만 건이면 2000 기준 scroll 500회.
  batch_size: 2000
  scroll_ttl: "5m"
  # 시간 범위 외에 추가로 걸 필터. Elasticsearch query DSL 절을 그대로 적는다.
  # 여러 개를 적으면 전부 AND 로 묶인다. 자세한 설명은 docs/usage.md 에 있다.
  #   - term: { level: "ERROR" }   # 값이 일치하는 문서만
  extra_filters:
    # 이 필드가 색인된 문서만 받는다. Kibana 의 `response_body_content.raw_text: *`
    # 와 같은 조건이다.
    - exists: { field: "response_body_content.raw_text" }
    # exists 는 빈 문자열을 걸러내지 못한다 — Elasticsearch 는 "" 를 값으로 본다.
    # 빠지는 것은 null 과 [] 뿐이다. 답변이 빈 채로 끝난 문서까지 받지 않으려면
    # 따로 빼야 한다.
    #
    # 매핑이 keyword 인지 text + .keyword 인지에 따라 걸리는 쪽이 다르다. 둘 다
    # 적어두면 없는 필드 쪽은 아무것도 걸러내지 않으므로 해가 없다. text 로만
    # 매핑돼 있으면 둘 다 안 먹으니, 건수를 비교해 확인해야 한다.
    - bool:
        must_not:
          - term: { "response_body_content.raw_text": "" }
          - term: { "response_body_content.raw_text.keyword": "" }

chunk:
  # 하루의 경계를 계산할 때 쓰는 타임존. 질의는 이 값을 오프셋으로 붙여 보낸다.
  timezone: "Asia/Seoul"
  # 인자 없이 실행할 때의 기준 시각. 19:00 에 돌면 전날 18:00 ~ 당일 18:00 을 받는다.
  # --from/--to 를 명시하면 이 값은 쓰이지 않는다.
  anchor_time: "18:00"
  # 한 번의 조회가 덮는 시간 폭. 24 를 넘길 수 없다.
  chunk_hours: 24

output:
  # 상대 경로는 실행 위치(cwd) 기준으로 해석된다.
  directory: "outputs"
  # Excel 에서 한글이 깨지지 않도록 BOM 을 붙인다.
  encoding: "utf-8-sig"
  write_header: true
  # 필드가 아예 없을 때와 값이 null 일 때를 구분한다.
  missing_value: ""
  null_value: "NULL"
  # 스키마 대조에 쓸 표본 크기. 첫 청크에서만 모은다.
  schema_sample: 1000
  # 진행 상황을 몇 건마다 찍을지.
  progress_every: 50000
  # CSV 에 담을 컬럼. source 는 _source 안의 경로이며,
  # _id / _index / _score 는 히트 최상위 메타데이터에서 읽는다.
  #
  # 리스트에서 하나를 고를 때는 대괄호를 쓴다. 음수는 뒤에서 센다 —
  # messages[-1] 은 길이가 매번 달라도 언제나 마지막 하나다.
  columns:
    - source: "_id"
      header: "doc_id"
    - source: "@timestamp"
      header: "timestamp"
    - source: "request_header_content.chat_id"
      header: "chat_id"
    # 어느 계통에서 온 요청인가. 실제 값은 이 파일에 적지 않는다 —
    # env.yaml 에만 둔다. 계통마다 아래 question_raw 의 모양이 다르다.
    - source: "response_header_content.send-system-name"
      header: "system_name"
    # 대화 이력의 마지막 항목이 이번 턴의 질문이다. 다만 계통에 따라 질문만
    # 담기기도 하고 템플릿에 싸여 오기도 하므로 아직 raw 다.
    - source: "request_body_content.messages[-1].content"
      header: "question_raw"
    - source: "response_body_content.raw_text"
      header: "answer"

  # ── 아직 코드가 읽지 않는다. 모양만 정해두고 주석으로 둔다 ──────────────
  #
  # question_raw 에서 실제 질의만 꺼내는 규칙. 계통(system_name)마다 담기는
  # 모양이 달라서, 어느 계통이 어느 방법을 쓰는지는 데이터로 둔다.
  #
  # 계통 이름과 마커 문자열은 **이 파일에 적지 않는다.** env.yaml 에만 둔다.
  # 여기 적는 AA~EE 는 자리표시이고, 실제 이름으로 바꾸는 것은 env.yaml 쪽이다.
  #
  # 꺼내는 방법 자체(raw / between / after)는 코드에 있다. 계통 이름도 마커도
  # 코드에는 없다.
  #
  # question:
  #   source: "request_body_content.messages[-1].content"
  #   by: "response_header_content.send-system-name"   # 어느 필드로 계통을 가르나
  #   rules:
  #     AA: raw                                   # 질의만 담겨 온다
  #     BB: { between: ["<여는표시>", "</닫는표시>"] }  # 둘 사이를 꺼낸다
  #     CC: { after: "<앞에 붙는 표시>" }              # 표시 뒤를 꺼낸다
  #     DD: raw
  #     EE: raw
  #   # 규칙에 없는 계통이 오면 원문을 그대로 두고 건수를 센다. 조용히 비우지
  #   # 않는다 — 새 계통이 붙거나 템플릿이 바뀐 것을 그 숫자로 알아챈다.
  #
  # 계통 이름은 대소문자를 가리지 않고 맞춘다. AA / aa / Aa 를 따로 적을 필요 없다.
